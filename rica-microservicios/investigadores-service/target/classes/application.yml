server:
  port: 8080

spring:
  application:
    name: investigadores-service
  datasource:
    url: jdbc:postgresql://localhost:5432/rica
    username: rica
    password: rica
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: investigadores-service
      auto-offset-reset: earliest

grpc:
  server:
    port: 9090
    
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
